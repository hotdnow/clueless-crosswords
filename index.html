<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clueless Crosswords</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Clueless">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1b1340">

<style>
:root{
  --bg1:#1b1340; --bg2:#4a2480; --panel:#2a1c5a; --panel2:#35247a;
  --gold:#ffcf3f; --teal:#2ec4b6; --pink:#ff4f8b; --ink:#231a3f; --paper:#fffaf0;
  --block:#120c2c; --text:#f6f1ff; --muted:#b9acdf; --bad:#e5384f; --good:#1fa97a;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:"Trebuchet MS","Segoe UI",system-ui,-apple-system,sans-serif;
  color:var(--text);
  background:radial-gradient(1200px 700px at 20% -10%,var(--bg2),transparent 60%),linear-gradient(160deg,var(--bg1),#120a2e 80%);
  background-attachment:fixed;
  -webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none;
}
button{font:inherit;color:inherit;cursor:pointer;border:0}
button:focus-visible,.cell:focus-visible,.chip:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hidden{display:none!important}
#app{max-width:1100px;margin:0 auto;padding:14px 14px 40px}
.screen{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Home */
.logo{text-align:center;margin:18px 0 6px}
.tiles{display:inline-flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:100%}
.tile{width:clamp(26px,5.2vw,40px);aspect-ratio:1;display:grid;place-items:center;border-radius:7px;font-weight:900;
  font-size:clamp(15px,3vw,23px);color:var(--ink);background:var(--paper);box-shadow:0 3px 0 rgba(0,0,0,.35);position:relative}
.tile small{position:absolute;top:2px;left:4px;font-size:.38em;font-weight:700;opacity:.55}
.tile.t1{background:var(--gold)}.tile.t2{background:var(--teal)}.tile.t3{background:var(--pink);color:#fff}
.tile.gap{background:transparent;box-shadow:none;width:10px}
.tagline{text-align:center;color:var(--muted);margin:10px 0 22px;font-size:1.05rem}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:0 auto 20px;max-width:900px}
.mode{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;background:linear-gradient(180deg,var(--panel2),var(--panel));border-radius:18px;padding:18px 18px 16px;text-align:left;
  box-shadow:0 6px 0 rgba(0,0,0,.35);transition:transform .12s}
.mode:hover{transform:translateY(-3px)}
.mode:active{transform:translateY(1px)}
.mode h3{margin:0 0 4px;font-size:1.35rem}
.mode p{margin:0;color:var(--muted);font-size:.95rem}
.mode .badge{display:inline-block;margin-bottom:8px;background:var(--gold);color:var(--ink);font-weight:800;font-size:.78rem;padding:3px 9px;border-radius:99px}
.mode.blitz .badge{background:var(--pink);color:#fff}.mode.mini .badge{background:var(--teal)}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin:10px 0}
.seg{display:inline-flex;background:var(--panel);border-radius:99px;padding:4px}
.seg button{background:transparent;padding:8px 16px;border-radius:99px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--gold);color:var(--ink)}
.lbl{color:var(--muted);font-size:.9rem;margin-right:4px}
.btn{background:var(--panel2);padding:10px 16px;border-radius:12px;font-weight:700;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.primary{background:var(--gold);color:var(--ink)}
.btn.small{padding:7px 12px;font-size:.9rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* Game */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.topbar h2{margin:0;font-size:1.05rem;text-align:center;flex:1}
.topbar h2 small{display:block;color:var(--muted);font-weight:400;font-size:.8rem}
.info{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.stat{background:var(--panel);border-radius:12px;padding:7px 6px;text-align:center}
.stat b{display:block;font-size:1.25rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat.hit{background:var(--bad)}.stat.hit span{color:#fff}
.stat.btnstat{background:var(--teal);color:var(--ink);cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.stat.btnstat span{color:#0b3b36}
.stat.btnstat[disabled]{opacity:.5}
.meter{height:8px;background:var(--panel);border-radius:99px;overflow:hidden;margin:0 0 10px}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--pink));transition:width .2s linear}
.play{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;align-items:flex-start}
.boardwrap{position:relative}
.board{--bw:min(94vw,56vh,620px);--n:11;width:var(--bw);height:var(--bw);display:grid;gap:2px;padding:5px;background:var(--pink);border-radius:14px;
  box-shadow:0 8px 0 rgba(0,0,0,.35)}
.board.n5{--bw:min(88vw,52vh,420px);--n:5;gap:3px}
.cell{position:relative;border-radius:4px;display:grid;place-items:center;min-width:0;min-height:0}
.cell.block{background:var(--block)}
.cell.white{background:var(--paper);color:var(--ink);cursor:pointer}
.cell .n{position:absolute;top:2px;left:3px;font-size:calc(var(--bw) / var(--n) * .27);font-weight:700;color:#6b5f93;line-height:1}
.cell .l{font-size:calc(var(--bw) / var(--n) * .56);font-weight:800;line-height:1;padding-top:.12em}
.cell.same{background:#ffe9a6}
.cell.sel{background:var(--gold);box-shadow:inset 0 0 0 3px var(--ink)}
.cell.given .l{color:#0d7f74}
.cell.hint .l{color:#b4237a}
.cell.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18);background:#9df0c7}100%{transform:scale(1)}}
.cell.bad{animation:shake .35s;background:#ffb3bd}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.pause{position:absolute;inset:0;border-radius:14px;background:rgba(18,10,46,.96);display:grid;place-items:center;text-align:center;z-index:5;cursor:pointer}
.side{display:flex;flex-direction:column;gap:12px;width:min(94vw,520px)}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:5px}
.chip{background:var(--panel);border-radius:8px;padding:3px 0 4px;text-align:center;cursor:pointer;line-height:1.1}
.chip b{display:block;font-size:.72rem;color:var(--muted);font-weight:700}
.chip i{display:block;font-style:normal;font-weight:800;font-size:1.05rem;min-height:1.2em;color:var(--gold)}
.chip.on{outline:2px solid var(--gold)}
.chip.given i{color:var(--teal)}
.kb{display:flex;flex-direction:column;gap:6px;align-items:center}
.kbrow{display:flex;gap:5px;width:100%;justify-content:center}
.key{flex:1;max-width:48px;min-width:0;height:46px;border-radius:9px;background:var(--panel2);font-weight:800;font-size:1.05rem;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.key:active{transform:translateY(2px);box-shadow:none}
.key[disabled]{opacity:.25;cursor:default;box-shadow:none}
.hint-line{color:var(--muted);font-size:.85rem;text-align:center}

/* Stats / achievements */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.card{background:var(--panel);border-radius:14px;padding:12px;text-align:center}
.card b{display:block;font-size:1.5rem;color:var(--gold);font-variant-numeric:tabular-nums}
.card span{font-size:.8rem;color:var(--muted)}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin:14px 0}
.a{background:var(--panel);border-radius:14px;padding:12px;opacity:.55}
.a.done{opacity:1;background:linear-gradient(180deg,var(--panel2),var(--panel));outline:2px solid var(--gold)}
.a b{display:block}.a span{font-size:.85rem;color:var(--muted)}
.a .bar{height:6px;background:rgba(255,255,255,.12);border-radius:9px;margin-top:8px;overflow:hidden}
.a .bar i{display:block;height:100%;background:var(--teal)}

/* Modal / toast */
#modal{position:fixed;inset:0;background:rgba(10,6,28,.72);display:grid;place-items:center;z-index:50;padding:16px}
.dlg{background:linear-gradient(180deg,var(--panel2),var(--panel));border-radius:20px;padding:22px;max-width:460px;width:100%;box-shadow:0 10px 0 rgba(0,0,0,.35)}
.dlg h2{margin:0 0 8px}.dlg p,.dlg li{color:#e5dcff;line-height:1.45}
.dlg ul{padding-left:20px}
.dlg .row{justify-content:flex-end;margin-top:14px}
.big{font-size:2.4rem;font-weight:900;color:var(--gold);text-align:center;margin:6px 0}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 14px;margin:8px 0}
.kv span{color:var(--muted)}.kv b{text-align:right}
#toasts{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:var(--ink);border:2px solid var(--gold);padding:8px 14px;border-radius:12px;font-weight:700;animation:fade .2s;max-width:90vw;text-align:center}
.toast.err{border-color:var(--bad)}
#confetti i{position:fixed;top:-12px;width:10px;height:14px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (min-width:900px){
  .board{--bw:min(62vh,620px)}
  .board.n5{--bw:min(56vh,440px)}
  .side{width:420px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">

  <section id="home" class="screen">
    <div class="logo"><div class="tiles" id="logoTiles" aria-label="Clueless Crosswords"></div></div>
    <p class="tagline">Every letter is a number. There are no clues. Crack the code!</p>
    <div class="modes">
      <button class="mode" data-mode="classic"><span class="badge">11 × 11</span><h3>Classic</h3><p>Plain, clueless crossword goodness. Take your time.</p></button>
      <button class="mode blitz" data-mode="blitz"><span class="badge">11 × 11</span><h3>Blitz</h3><p>Beat the clock. You lose 300 points every 20 seconds.</p></button>
      <button class="mode mini" data-mode="mini"><span class="badge">5 × 5</span><h3>Mini</h3><p>Short games on a small grid.</p></button>
    </div>
    <div class="row"><span class="lbl">Letters revealed at start:</span>
      <div class="seg" id="diffSeg"><button data-d="easy">Many</button><button data-d="normal">Some</button><button data-d="hard">Few</button></div>
    </div>
    <div class="row">
      <button class="btn" id="btnStats">Stats</button>
      <button class="btn" id="btnAch">Trophies</button>
      <button class="btn" id="btnHow">How to play</button>
      <button class="btn" id="btnSound">Sound: on</button>
    </div>
  </section>

  <section id="game" class="screen hidden">
    <div class="topbar">
      <button class="btn small" id="gHome">← Home</button>
      <h2 id="gTitle">Classic<small id="gSub"></small></h2>
      <button class="btn small" id="gPause">Pause</button>
    </div>
    <div class="info">
      <div class="stat"><b id="iScore">0</b><span>Score</span></div>
      <div class="stat"><b id="iTime">0:00</b><span>Time</span></div>
      <div class="stat"><b id="iMist">0</b><span>Mistakes</span></div>
      <button class="stat btnstat" id="iHint"><b id="iHintN">0</b><span>Hint</span></button>
    </div>
    <div class="meter hidden" id="penMeter" title="Time until the next 300-point penalty"><i id="penBar"></i></div>
    <div class="play">
      <div class="boardwrap">
        <div class="board" id="board" role="grid" aria-label="Crossword grid"></div>
        <div class="pause hidden" id="pauseOv"><div><h2>Paused</h2><p>Tap to resume</p></div></div>
      </div>
      <div class="side">
        <div class="strip" id="strip" aria-label="Number to letter key"></div>
        <div class="kb" id="kb"></div>
        <div class="hint-line">Pick a square, then type a letter. Arrow keys move. Same number = same letter.</div>
      </div>
    </div>
  </section>

  <section id="stats" class="screen hidden">
    <div class="topbar"><button class="btn small" data-back>← Home</button><h2>Your stats</h2><span style="width:80px"></span></div>
    <div class="cards" id="statCards"></div>
  </section>

  <section id="ach" class="screen hidden">
    <div class="topbar"><button class="btn small" data-back>← Home</button><h2>Trophies</h2><span style="width:80px"></span></div>
    <div class="ach" id="achList"></div>
  </section>
</div>

<div id="modal" class="hidden" role="dialog" aria-modal="true"><div class="dlg" id="dlg"></div></div>
<div id="toasts" aria-live="polite"></div>
<div id="confetti"></div>

/* ---------- persistence ---------- */
var KEY = 'crosswordCipherParty.v1';
function defaults(){ return {
  scoreOverallTotal:0, classicScoreTotal:0, blitzScoreTotal:0, miniScoreTotal:0,
  classicScoreHighest:0, blitzScoreHighest:0, miniScoreHighest:0,
  classicBestTime:0, blitzBestTime:0, miniBestTime:0,
  solved:0, lettersPlaced:0, mistakes:0, hintsUsed:0,
  hintsAvailable:10, scoreLastAcquiredHint:0,
  crosswordsUsed:[], miniCrosswordsUsed:[],
  sounds:true, diff:'normal', ach:{}
};}
function load(){
  var d = defaults();
  try{ var raw = localStorage.getItem(KEY); if(raw){ var o = JSON.parse(raw); for(var k in d) if(k in o) d[k]=o[k]; } }catch(e){}
  return d;
}
var S = load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ---------- helpers ---------- */
function $(id){ return document.getElementById(id); }
function el(tag, cls, html){ var e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
function fmtTime(s){ s=Math.floor(s); var m=Math.floor(s/60), r=s%60; return m+':'+(r<10?'0':'')+r; }
function fmtNum(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function toast(msg, err){
  var t = el('div','toast'+(err?' err':''),''); t.textContent = msg; $('toasts').appendChild(t);
  setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 2400);
}

/* ---------- sound ---------- */
var ac = null;
function tone(freq, dur, type, vol, delay){
  if(!S.sounds) return;
  try{
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    var t0 = ac.currentTime + (delay||0);
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = type||'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol||0.07, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0+dur+0.02);
  }catch(e){}
}
var sfx = {
  good:function(){ tone(660,.12,'triangle'); tone(880,.16,'triangle',.07,.08); },
  bad:function(){ tone(150,.25,'sawtooth',.06); },
  pen:function(){ tone(300,.12,'square',.05); tone(220,.18,'square',.05,.1); },
  hint:function(){ tone(520,.1,'sine'); tone(780,.18,'sine',.07,.1); },
  win:function(){ [523,659,784,1047].forEach(function(f,i){ tone(f,.22,'triangle',.08,i*.12); }); },
  tick:function(){ tone(900,.03,'sine',.03); }
};

/* ---------- achievements ---------- */
var ACH = [];
[1,5,10,50,100,200,500].forEach(function(n){ ACH.push({id:'solve'+n, name:'Solver '+n, desc:'Solve '+n+' puzzle'+(n>1?'s':''), val:function(){return S.solved;}, goal:n}); });
[1,50,100,200,1000,2000,5000].forEach(function(n){ ACH.push({id:'letter'+n, name:'Letters '+n, desc:'Place '+fmtNum(n)+' letter'+(n>1?'s':''), val:function(){return S.lettersPlaced;}, goal:n}); });
[1,10,50].forEach(function(n){ ACH.push({id:'mistake'+n, name:'Oops '+n, desc:'Make '+n+' mistake'+(n>1?'s':''), val:function(){return S.mistakes;}, goal:n}); });
[1,2,5,10,20].forEach(function(n){ ACH.push({id:'hint'+n, name:'Helping hand '+n, desc:'Use '+n+' hint'+(n>1?'s':''), val:function(){return S.hintsUsed;}, goal:n}); });
function checkAch(){
  ACH.forEach(function(a){
    if(!S.ach[a.id] && a.val() >= a.goal){ S.ach[a.id] = true; toast('Trophy unlocked: '+a.name); }
  });
}

/* ---------- scoring ---------- */
function addScore(delta){
  if(!g) return;
  var before = g.score;
  g.score = Math.max(0, g.score + delta);
  var real = g.score - before; // actual change after clamping
  S.scoreOverallTotal = Math.max(0, S.scoreOverallTotal + real);
  var k = g.mode + 'ScoreTotal'; S[k] = Math.max(0, S[k] + real);
  while(S.scoreOverallTotal >= S.scoreLastAcquiredHint + 10000){
    S.scoreLastAcquiredHint += 10000; S.hintsAvailable++; toast('+1 hint earned!');
  }
}

/* ---------- game state ---------- */
var MODES = { classic:{pool:'classic', size:11, title:'Classic'}, blitz:{pool:'classic', size:11, title:'Blitz'}, mini:{pool:'mini', size:5, title:'Mini'} };
var REVEAL = { classic:{easy:6,normal:3,hard:1}, blitz:{easy:6,normal:3,hard:1}, mini:{easy:3,normal:2,hard:1} };
var g = null;
var ticker = null;

function pickPuzzle(mode){
  var m = MODES[mode], list = PUZ[m.pool];
  var key = m.pool === 'mini' ? 'miniCrosswordsUsed' : 'crosswordsUsed';
  var used = S[key];
  var free = [];
  for(var i=0;i<list.length;i++) if(used.indexOf(i) < 0) free.push(i);
  if(!free.length){ S[key] = used = []; for(i=0;i<list.length;i++) free.push(i); }
  return free[Math.floor(Math.random()*free.length)];
}

function startGame(mode, idx){
  var m = MODES[mode], n = m.size;
  if(idx == null) idx = pickPuzzle(mode);
  var str = PUZ[m.pool][idx];
  var perm = shuffle(Array.apply(null,{length:26}).map(function(_,i){ return i+1; }));
  var sol = [], num = [], countByLetter = {}, letterOfNum = {}, numCells = {};
  for(var r=0;r<n;r++){
    sol.push([]); num.push([]);
    for(var c=0;c<n;c++){
      var ch = str.charAt(r*n+c);
      if(ch === '.'){ sol[r].push(null); num[r].push(null); continue; }
      var N = perm[ch.charCodeAt(0)-97];
      sol[r].push(ch); num[r].push(N);
      letterOfNum[N] = ch; countByLetter[ch] = (countByLetter[ch]||0)+1;
      (numCells[N] = numCells[N] || []).push([r,c]);
    }
  }
  g = {
    mode:mode, n:n, idx:idx, sol:sol, num:num, letterOfNum:letterOfNum, numCells:numCells,
    numbers:Object.keys(letterOfNum).map(Number).sort(function(a,b){return a-b;}),
    solved:{}, given:{}, hinted:{}, usedLetters:{},
    sel:null, score:0, mistakes:0, streak:0, elapsed:0, penaltyClock:0,
    paused:false, over:false, last:Date.now(), placed:0
  };
  // reveal starting letters: pick from the most frequent letters
  var letters = Object.keys(countByLetter).sort(function(a,b){ return countByLetter[b]-countByLetter[a]; });
  var k = REVEAL[mode][S.diff] || 3;
  var pool = letters.slice(0, Math.min(letters.length, k+4));
  shuffle(pool).slice(0,k).forEach(function(L){
    for(var N in letterOfNum) if(letterOfNum[N] === L){ g.solved[N] = true; g.given[N] = true; g.usedLetters[L] = true; }
  });
  buildBoard();
  selectFirst();
  show('game');
  $('gTitle').firstChild.nodeValue = m.title;
  $('gSub').textContent = 'Puzzle #' + (idx+1);
  $('penMeter').classList.toggle('hidden', mode !== 'blitz');
  $('pauseOv').classList.add('hidden'); $('gPause').textContent = 'Pause';
  closeModal();
  render();
  if(ticker) clearInterval(ticker);
  ticker = setInterval(tick, 200);
}

function buildBoard(){
  var b = $('board'); b.innerHTML = '';
  b.className = 'board n' + g.n;
  b.style.gridTemplateColumns = 'repeat(' + g.n + ', 1fr)';
  b.style.gridTemplateRows = 'repeat(' + g.n + ', 1fr)';
  for(var r=0;r<g.n;r++) for(var c=0;c<g.n;c++){
    var d = el('div', g.sol[r][c] ? 'cell white' : 'cell block');
    d.dataset.r = r; d.dataset.c = c;
    if(g.sol[r][c]){ d.appendChild(el('span','n', String(g.num[r][c]))); d.appendChild(el('span','l','')); d.setAttribute('role','gridcell'); }
    b.appendChild(d);
  }
  // key strip
  var s = $('strip'); s.innerHTML = '';
  g.numbers.forEach(function(N){
    var ch = el('div','chip','<b>'+N+'</b><i></i>'); ch.dataset.n = N; ch.setAttribute('role','button'); ch.tabIndex = 0;
    s.appendChild(ch);
  });
  // keyboard
  var kb = $('kb'); kb.innerHTML = '';
  ['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'].forEach(function(row){
    var rd = el('div','kbrow');
    row.split('').forEach(function(L){ var k = el('button','key',L); k.dataset.k = L.toLowerCase(); k.type='button'; rd.appendChild(k); });
    kb.appendChild(rd);
  });
}

function cellEl(r,c){ return $('board').children[r*g.n+c]; }

function render(){
  if(!g) return;
  var selN = g.sel ? g.num[g.sel[0]][g.sel[1]] : null;
  for(var r=0;r<g.n;r++) for(var c=0;c<g.n;c++){
    var N = g.num[r][c]; if(N == null) continue;
    var e = cellEl(r,c), L = e.lastChild;
    var cls = 'cell white';
    var txt = '';
    if(g.solved[N]){ txt = g.letterOfNum[N].toUpperCase(); if(g.given[N]) cls += ' given'; else if(g.hinted[N]) cls += ' hint'; }
    if(selN === N) cls += ' same';
    if(g.sel && g.sel[0]===r && g.sel[1]===c) cls += ' sel';
    var keep = e.className.match(/\b(pop|bad)\b/);
    if(keep) cls += ' ' + keep[1];
    if(e.className !== cls) e.className = cls;
    if(L.textContent !== txt) L.textContent = txt;
  }
  var chips = $('strip').children;
  for(var i=0;i<chips.length;i++){
    var n2 = +chips[i].dataset.n, cc = 'chip';
    if(g.given[n2]) cc += ' given';
    if(selN === n2) cc += ' on';
    chips[i].className = cc;
    chips[i].lastChild.textContent = g.solved[n2] ? g.letterOfNum[n2].toUpperCase() : '';
  }
  var keys = $('kb').querySelectorAll('.key');
  for(i=0;i<keys.length;i++) keys[i].disabled = !!g.usedLetters[keys[i].dataset.k] || g.over;
  $('iScore').textContent = fmtNum(g.score);
  $('iTime').textContent = fmtTime(g.elapsed);
  $('iMist').textContent = g.mistakes;
  $('iHintN').textContent = S.hintsAvailable;
  $('iHint').disabled = g.over;
}

/* ---------- selection ---------- */
function unsolvedCells(){
  var out = [];
  for(var r=0;r<g.n;r++) for(var c=0;c<g.n;c++){ var N=g.num[r][c]; if(N!=null && !g.solved[N]) out.push([r,c]); }
  return out;
}
function selectFirst(){ var u = unsolvedCells(); g.sel = u.length ? u[0] : null; }
function advance(){
  var u = unsolvedCells(); if(!u.length){ g.sel = null; return; }
  if(g.sel){
    var cur = g.sel[0]*g.n + g.sel[1];
    for(var i=0;i<u.length;i++) if(u[i][0]*g.n+u[i][1] > cur){ g.sel = u[i]; return; }
  }
  g.sel = u[0];
}
function selectNumber(N){
  var cells = g.numCells[N]; if(!cells) return;
  g.sel = cells[0]; render();
}
function move(dr, dc){
  if(!g || g.over || g.paused) return;
  if(!g.sel){ g.sel = g.numCells[g.numbers[0]][0]; render(); return; }
  var r = g.sel[0], c = g.sel[1];
  for(;;){
    r += dr; c += dc;
    if(r<0||c<0||r>=g.n||c>=g.n) return;
    if(g.sol[r][c]){ g.sel = [r,c]; render(); return; }
  }
}

/* ---------- actions ---------- */
function flash(N, cls){
  (g.numCells[N]||[]).forEach(function(p){
    var e = cellEl(p[0],p[1]); e.classList.remove('pop','bad'); void e.offsetWidth; e.classList.add(cls);
    setTimeout(function(){ e.classList.remove(cls); }, 420);
  });
}
function solveNumber(N){
  g.solved[N] = true; g.usedLetters[g.letterOfNum[N]] = true;
}
function place(letter){
  if(!g || g.over || g.paused) return;
  if(!g.sel){ toast('Pick a square first'); return; }
  var N = g.num[g.sel[0]][g.sel[1]];
  if(g.solved[N]){ advance(); render(); return; }
  var L = letter.toLowerCase();
  if(g.usedLetters[L]){ toast('That letter is already placed', true); return; }
  if(g.letterOfNum[N] === L){
    solveNumber(N); g.streak++; g.placed++; S.lettersPlaced++;
    var cells = g.numCells[N].length;
    var mult = (g.mode === 'blitz' ? 1.5 : 1) * Math.min(g.streak, 5);
    var gain = Math.round(50 * cells * mult);
    addScore(gain);
    sfx.good();
    advance(); render(); flash(N, 'pop');
    checkAch(); save();
    if(Object.keys(g.solved).length === g.numbers.length) win();
  } else {
    g.mistakes++; S.mistakes++; g.streak = 0;
    addScore(-150);
    sfx.bad(); render(); flash(N, 'bad');
    checkAch(); save();
  }
}
function useHint(){
  if(!g || g.over || g.paused) return;
  if(S.hintsAvailable <= 0){ toast('No hints left. Earn one every 10,000 points.', true); return; }
  var N = g.sel ? g.num[g.sel[0]][g.sel[1]] : null;
  if(N == null || g.solved[N]){
    var best = null, bestC = -1;
    g.numbers.forEach(function(M){ if(!g.solved[M] && g.numCells[M].length > bestC){ best = M; bestC = g.numCells[M].length; } });
    N = best;
  }
  if(N == null) return;
  S.hintsAvailable--; S.hintsUsed++; g.hinted[N] = true;
  solveNumber(N);
  sfx.hint();
  if(g.sel && g.num[g.sel[0]][g.sel[1]] === N) advance();
  render(); flash(N,'pop');
  checkAch(); save();
  if(Object.keys(g.solved).length === g.numbers.length) win();
}
var BLITZ_PENALTY = 300;
function applyPenalty(){
  var before = g.score;
  addScore(-BLITZ_PENALTY);
  sfx.pen(); toast('Time penalty: -' + fmtNum(before - g.score) + ' points', true);
  var s = $('iScore').parentNode; s.classList.add('hit'); setTimeout(function(){ s.classList.remove('hit'); }, 600);
  render();
}
function tick(){
  if(!g) return;
  var now = Date.now(), dt = Math.min(1000, now - g.last); g.last = now;
  if(g.paused || g.over) return;
  g.elapsed += dt/1000;
  if(g.mode === 'blitz'){
    g.penaltyClock += dt/1000;
    if(g.penaltyClock >= 20){ g.penaltyClock -= 20; applyPenalty(); }
    $('penBar').style.width = Math.min(100, g.penaltyClock/20*100) + '%';
  }
  $('iTime').textContent = fmtTime(g.elapsed);
}
function setPaused(p){
  if(!g || g.over) return;
  g.paused = p; g.last = Date.now();
  $('pauseOv').classList.toggle('hidden', !p);
  $('gPause').textContent = p ? 'Resume' : 'Pause';
}

/* ---------- win ---------- */
function win(){
  g.over = true;
  var secs = Math.floor(g.elapsed), bonus;
  if(g.mode === 'mini') bonus = Math.max(100, 600 - 2*secs);
  else bonus = Math.max(300, 3000 - 3*secs);
  if(g.mode === 'blitz') bonus = Math.round(bonus*1.5);
  addScore(bonus);
  S.solved++;
  var hk = g.mode + 'ScoreHighest'; if(g.score > S[hk]) S[hk] = g.score;
  var tk = g.mode + 'BestTime'; if(!S[tk] || secs < S[tk]) S[tk] = secs;
  var pk = MODES[g.mode].pool === 'mini' ? 'miniCrosswordsUsed' : 'crosswordsUsed';
  if(S[pk].indexOf(g.idx) < 0) S[pk].push(g.idx);
  checkAch(); save();
  sfx.win(); confetti(); render();
  var mode = g.mode;
  var html = '<h2>Puzzle solved!</h2><div class="big">' + fmtNum(g.score) + '</div>' +
    '<div class="kv"><span>Time</span><b>' + fmtTime(g.elapsed) + '</b>' +
    '<span>Time bonus</span><b>+' + fmtNum(bonus) + '</b>' +
    '<span>Mistakes</span><b>' + g.mistakes + '</b>' +
    '<span>Best score (' + MODES[mode].title + ')</span><b>' + fmtNum(S[hk]) + '</b></div>';
  openModal(html, [
    {label:'Home', fn:function(){ closeModal(); goHome(); }},
    {label:'Next puzzle', primary:true, fn:function(){ startGame(mode); }}
  ]);
}
function confetti(){
  var box = $('confetti'), colors = ['#ffcf3f','#2ec4b6','#ff4f8b','#fffaf0','#8e6bff'];
  for(var i=0;i<60;i++){
    var p = document.createElement('i');
    p.style.left = Math.random()*100 + 'vw'; p.style.background = colors[i%colors.length];
    p.style.animationDuration = (1.8 + Math.random()*1.8) + 's'; p.style.animationDelay = (Math.random()*.5) + 's';
    box.appendChild(p);
    (function(x){ setTimeout(function(){ if(x.parentNode) x.parentNode.removeChild(x); }, 4200); })(p);
  }
}

/* ---------- modal & navigation ---------- */
function openModal(html, buttons){
  var d = $('dlg'); d.innerHTML = html;
  var row = el('div','row');
  buttons.forEach(function(b){ var x = el('button','btn'+(b.primary?' primary':''), b.label); x.type='button'; x.addEventListener('click', b.fn); row.appendChild(x); });
  d.appendChild(row); $('modal').classList.remove('hidden');
  var first = row.lastChild; if(first) first.focus();
}
function closeModal(){ $('modal').classList.add('hidden'); }
function show(id){
  ['home','game','stats','ach'].forEach(function(s){ $(s).classList.toggle('hidden', s !== id); });
  window.scrollTo(0,0);
}
function goHome(){
  if(ticker){ clearInterval(ticker); ticker = null; }
  g = null; show('home'); refreshHome();
}
function refreshHome(){
  var b = $('diffSeg').children;
  for(var i=0;i<b.length;i++) b[i].classList.toggle('on', b[i].dataset.d === S.diff);
  $('btnSound').textContent = 'Sound: ' + (S.sounds ? 'on' : 'off');
}
function showStats(){
  var cards = [
    ['Puzzles solved', S.solved], ['Total score', fmtNum(S.scoreOverallTotal)],
    ['Best Classic', fmtNum(S.classicScoreHighest)], ['Best Blitz', fmtNum(S.blitzScoreHighest)], ['Best Mini', fmtNum(S.miniScoreHighest)],
    ['Fastest Classic', S.classicBestTime ? fmtTime(S.classicBestTime) : '-'], ['Fastest Blitz', S.blitzBestTime ? fmtTime(S.blitzBestTime) : '-'], ['Fastest Mini', S.miniBestTime ? fmtTime(S.miniBestTime) : '-'],
    ['Letters placed', fmtNum(S.lettersPlaced)], ['Mistakes', fmtNum(S.mistakes)], ['Hints used', S.hintsUsed], ['Hints available', S.hintsAvailable]
  ];
  var box = $('statCards'); box.innerHTML = '';
  cards.forEach(function(c){ box.appendChild(el('div','card','<b>'+c[1]+'</b><span>'+c[0]+'</span>')); });
  show('stats');
}
function showAch(){
  var box = $('achList'); box.innerHTML = '';
  ACH.forEach(function(a){
    var v = Math.min(a.val(), a.goal), done = !!S.ach[a.id];
    var d = el('div','a'+(done?' done':''), '<b>'+(done?'★ ':'')+a.name+'</b><span>'+a.desc+'</span><div class="bar"><i style="width:'+Math.round(v/a.goal*100)+'%"></i></div>');
    box.appendChild(d);
  });
  show('ach');
}
function howTo(){
  openModal('<h2>How to play</h2><ul>' +
    '<li>Every square has a number from 1 to 26. Each number stands for one letter, and the same number is always the same letter.</li>' +
    '<li>There are no clues. The grid is a normal crossword, so use word shapes and the letters already shown to work out the rest.</li>' +
    '<li>Tap a square and press a letter. A right guess fills every square with that number. A wrong guess costs points.</li>' +
    '<li>Hints reveal one number. You earn a new hint every 10,000 points.</li>' +
    '<li><b>Blitz:</b> every 20 seconds you lose 300 points, so solve fast. Your score never drops below zero.</li></ul>',
    [{label:'Got it', primary:true, fn:closeModal}]);
}

/* ---------- wiring ---------- */
function buildLogo(){
  var box = $('logoTiles'), words = ['CLUELESS','CROSSWORDS'], ci = 0;
  words.forEach(function(w, wi){
    w.split('').forEach(function(ch, i){
      var t = el('div','tile t'+((ci++ % 3)+1), ch); t.appendChild(el('small','', String(((ci*7)%26)+1))); box.appendChild(t);
    });
    if(wi < words.length-1) box.appendChild(el('div','tile gap',''));
  });
}
document.querySelectorAll('.mode').forEach(function(b){ b.addEventListener('click', function(){ startGame(b.dataset.mode); }); });
$('diffSeg').addEventListener('click', function(e){ var d = e.target.dataset && e.target.dataset.d; if(d){ S.diff = d; save(); refreshHome(); } });
$('btnStats').addEventListener('click', showStats);
$('btnAch').addEventListener('click', showAch);
$('btnHow').addEventListener('click', howTo);
$('btnSound').addEventListener('click', function(){ S.sounds = !S.sounds; save(); refreshHome(); if(S.sounds) sfx.tick(); });
document.querySelectorAll('[data-back]').forEach(function(b){ b.addEventListener('click', goHome); });
$('gHome').addEventListener('click', function(){
  if(g && !g.over){
    setPaused(true);
    openModal('<h2>Leave this puzzle?</h2><p>Your progress on this grid will be lost.</p>', [
      {label:'Keep playing', primary:true, fn:function(){ closeModal(); setPaused(false); }},
      {label:'Leave', fn:function(){ closeModal(); goHome(); }}
    ]);
  } else goHome();
});
$('gPause').addEventListener('click', function(){ if(g) setPaused(!g.paused); });
$('pauseOv').addEventListener('click', function(){ setPaused(false); });
$('iHint').addEventListener('click', useHint);
$('board').addEventListener('click', function(e){
  if(!g || g.over || g.paused) return;
  var t = e.target.closest('.cell'); if(!t || !t.classList.contains('white')) return;
  g.sel = [+t.dataset.r, +t.dataset.c]; render();
});
$('strip').addEventListener('click', function(e){ var t = e.target.closest('.chip'); if(t && g && !g.over && !g.paused) selectNumber(+t.dataset.n); });
$('kb').addEventListener('click', function(e){ var t = e.target.closest('.key'); if(t) place(t.dataset.k); });
document.addEventListener('keydown', function(e){
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  if(e.key === 'Escape'){ if(!$('modal').classList.contains('hidden')) closeModal(); return; }
  if(!g || $('game').classList.contains('hidden') || !$('modal').classList.contains('hidden')) return;
  var k = e.key;
  if(/^[a-zA-Z]$/.test(k)){ place(k); e.preventDefault(); }
  else if(k === 'ArrowUp'){ move(-1,0); e.preventDefault(); }
  else if(k === 'ArrowDown'){ move(1,0); e.preventDefault(); }
  else if(k === 'ArrowLeft'){ move(0,-1); e.preventDefault(); }
  else if(k === 'ArrowRight'){ move(0,1); e.preventDefault(); }
});
document.addEventListener('visibilitychange', function(){ if(document.hidden && g && !g.over) setPaused(true); });

buildLogo(); refreshHome(); checkAch();
window.CCP = { state:function(){ return g; }, stats:function(){ return S; }, start:startGame };
})();
</script>
<script>if('serviceWorker' in navigator && /^https?:/.test(location.protocol)){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
